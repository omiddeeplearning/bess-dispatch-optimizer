<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Battery AI Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .battery-level-animation {
            transition: height 0.5s ease-in-out;
        }
        .bar-highlight {
            box-shadow: 0 0 15px 5px rgba(59, 130, 246, 0.5); /* Brighter blue shadow */
            transform: scaleY(1.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="gradient-bg text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-6xl bg-white/60 backdrop-blur-xl rounded-2xl shadow-2xl p-6 md:p-8 border border-white/30">
        
        <header class="mb-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight">DailyBattery</h1>
            <p class="text-gray-700 mt-2 max-w-3xl mx-auto">
                Leveraging advanced AI to optimize your battery's energy dispatch, maximizing revenue and supporting a sustainable grid.
            </p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 card p-6 rounded-xl">
                <h2 class="text-xl font-semibold text-gray-800 mb-1">Market Price</h2>
                <p id="simulation-time" class="text-gray-500 mb-6">Time: 00:00</p>
                <div id="chart-container" class="h-64 flex items-end justify-between space-x-1">
                    <!-- Bars will be dynamically generated here -->
                </div>
            </div>

            <div class="flex flex-col justify-between space-y-6">
                <div class="card p-6 rounded-xl text-center">
                    <h3 class="text-gray-600 font-medium mb-2">Live Market Price</h3>
                    <p class="text-4xl font-bold text-gray-900"><span id="market-price">15</span><span class="text-2xl font-normal text-gray-500"> £/MWh</span></p>
                </div>

                <div class="card p-6 rounded-xl flex flex-col items-center justify-center flex-grow">
                    <div class="relative w-32 h-56 bg-gray-200 rounded-lg border-4 border-gray-300 p-2 flex items-end">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full w-12 h-4 bg-gray-300 rounded-t-md"></div>
                        <div id="battery-level" class="w-full bg-gradient-to-t from-green-400 to-green-600 rounded-sm battery-level-animation" style="height: 50%;"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span id="battery-percentage" class="text-2xl font-bold text-white" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">50%</span>
                        </div>
                    </div>
                </div>

                <div id="status-card" class="card p-6 rounded-xl flex items-center transition-all duration-300">
                    <div id="status-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mr-4 bg-gray-200">
                        <!-- SVG Icon will be injected here -->
                    </div>
                    <div>
                        <h3 id="status-text" class="text-xl font-semibold text-gray-900">Idle</h3>
                        <p id="status-description" class="text-gray-600">Awaiting optimal price conditions.</p>
                    </div>
                </div>
            </div>
        </main>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chartContainer = document.getElementById('chart-container');
            const marketPriceEl = document.getElementById('market-price');
            const batteryLevelEl = document.getElementById('battery-level');
            const batteryPercentageEl = document.getElementById('battery-percentage');
            const statusTextEl = document.getElementById('status-text');
            const statusDescriptionEl = document.getElementById('status-description');
            const statusCardEl = document.getElementById('status-card');
            const statusIconContainerEl = document.getElementById('status-icon-container');
            const simulationTimeEl = document.getElementById('simulation-time');

            const prices = [15, 12, 10, 8, 7, 9, 14, 20, 25, 30, 28, 22, 18, 16, 19, 24, 35, 45, 42, 38, 30, 22, 18, 16];
            const chargeThreshold = 12;
            const dischargeThreshold = 30;
            const chargeRate = 10;
            const dischargeRate = 15;
            const maxPrice = Math.max(...prices);
            
            let batteryLevel = 50;
            let currentHour = 0;
            let simulationInterval = null;
            let isRunning = false;

            const icons = {
                charging: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`,
                discharging: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>`,
                idle: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
            };
            
            function generateChart() {
                chartContainer.innerHTML = '';
                prices.forEach((price, index) => {
                    const barHeight = (price / maxPrice) * 100;
                    const bar = document.createElement('div');
                    bar.style.height = `${barHeight}%`;
                    bar.classList.add('w-full', 'bg-blue-300', 'rounded-t-md', 'transition-all', 'duration-300', 'hover:bg-blue-400');
                    bar.dataset.hour = index;
                    chartContainer.appendChild(bar);
                });
            }

            function updateUI() {
                const timeString = `${String(currentHour).padStart(2, '0')}:00`;
                simulationTimeEl.textContent = `Time: ${timeString}`;
                marketPriceEl.textContent = prices[currentHour];
                
                batteryLevelEl.style.height = `${batteryLevel}%`;
                batteryPercentageEl.textContent = `${Math.round(batteryLevel)}%`;

                document.querySelectorAll('#chart-container > div').forEach((bar, index) => {
                    bar.classList.toggle('bar-highlight', index === currentHour);
                    bar.classList.toggle('bg-blue-500', index === currentHour);
                });
            }

            function setStatus(state) {
                let text, description, icon, cardClass, iconBgClass;

                switch (state) {
                    case 'charging':
                        text = 'Charging';
                        description = 'Storing energy at low market price.';
                        icon = icons.charging;
                        cardClass = 'border-green-400/50';
                        iconBgClass = 'bg-green-100';
                        break;
                    case 'discharging':
                        text = 'Discharging';
                        description = 'Selling energy at high market price.';
                        icon = icons.discharging;
                        cardClass = 'border-red-400/50';
                        iconBgClass = 'bg-red-100';
                        break;
                    default:
                        text = 'Idle';
                        description = 'Awaiting optimal price conditions.';
                        icon = icons.idle;
                        cardClass = 'border-gray-300/50';
                        iconBgClass = 'bg-gray-200';
                        break;
                }
                
                statusTextEl.textContent = text;
                statusDescriptionEl.textContent = description;
                statusIconContainerEl.innerHTML = icon;
                
                statusCardEl.className = statusCardEl.className.replace(/border-(green|red|gray)-(300|400)(\/50)?/g, '');
                statusCardEl.classList.add(cardClass);
                
                statusIconContainerEl.className = statusIconContainerEl.className.replace(/bg-(green|red|gray)-(100|200)/g, '');
                statusIconContainerEl.classList.add(iconBgClass);
            }

            function simulationStep() {
                if (currentHour >= prices.length) {
                    restartCycle();
                    return;
                }

                const currentPrice = prices[currentHour];
                const currentBar = chartContainer.children[currentHour];
                
                currentBar.classList.remove('bg-green-500', 'bg-red-500');
                currentBar.classList.add('bg-blue-300');

                if (currentHour >= 22 && batteryLevel < 10) {
                    batteryLevel = Math.min(100, batteryLevel + chargeRate);
                    setStatus('charging');
                    currentBar.classList.replace('bg-blue-300', 'bg-green-500');
                } else if (currentPrice <= chargeThreshold && batteryLevel < 100) {
                    batteryLevel = Math.min(100, batteryLevel + chargeRate);
                    setStatus('charging');
                    currentBar.classList.replace('bg-blue-300', 'bg-green-500');
                } else if (currentPrice >= dischargeThreshold && batteryLevel > 0) {
                    batteryLevel = Math.max(0, batteryLevel - dischargeRate);
                    setStatus('discharging');
                    currentBar.classList.replace('bg-blue-300', 'bg-red-500');
                } else {
                    setStatus('idle');
                }

                updateUI();
                currentHour++;
            }

            function startSimulation() {
                if (isRunning) return;
                isRunning = true;
                simulationStep(); 
                simulationInterval = setInterval(simulationStep, 1000);
            }

            function restartCycle() {
                clearInterval(simulationInterval);
                simulationInterval = null;
                isRunning = false;
                currentHour = 0;
                batteryLevel = 50;
                generateChart();
                startSimulation();
            }

            generateChart();
            updateUI();
            setStatus('idle');
            startSimulation();
        });
    </script>
</body>
</html>
