<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Battery AI Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for the battery animation */
        .battery-level-animation {
            transition: height 0.5s ease-in-out;
        }
        /* Custom styles for the bar chart highlighting */
        .bar-highlight {
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.4);
            transform: scaleY(1.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-6xl bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl p-6 md:p-8 border border-gray-700">
        
        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">DailyBattery AI</h1>
            <p class="text-gray-400 mt-2 max-w-2xl">
                We use advanced AI and optimization techniques to analyze the daily energy market, identifying opportunities for your battery to generate revenue while supporting a greener grid.
            </p>
        </header>

        <!-- Main Content: Chart and Battery Info -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Chart Section -->
            <div class="lg:col-span-2 bg-gray-900/60 p-6 rounded-xl border border-gray-700">
                <h2 class="text-lg font-semibold text-gray-300 mb-1">Market Price</h2>
                <p id="simulation-time" class="text-gray-400 mb-6">Time: 00:00</p>
                <div id="chart-container" class="h-64 flex items-end justify-between space-x-1">
                    <!-- Bars will be dynamically generated here -->
                </div>
            </div>

            <!-- Battery & Info Section -->
            <div class="flex flex-col justify-between space-y-6">
                <!-- Market Price Card -->
                <div class="bg-gray-900/60 p-6 rounded-xl border border-gray-700 text-center">
                    <h3 class="text-gray-400 font-medium mb-2">Market Electricity Price</h3>
                    <p class="text-4xl font-bold text-white"><span id="market-price">15</span><span class="text-2xl font-normal text-gray-400">£/MWh</span></p>
                </div>

                <!-- Battery Visual -->
                <div class="flex-grow flex items-center justify-center">
                    <div class="relative w-32 h-56 bg-gray-700 rounded-lg border-4 border-gray-500 p-2 flex items-end">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full w-12 h-4 bg-gray-500 rounded-t-md"></div>
                        <div id="battery-level" class="w-full bg-green-500 rounded-sm battery-level-animation" style="height: 50%;"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span id="battery-percentage" class="text-2xl font-bold text-white mix-blend-difference">50%</span>
                        </div>
                    </div>
                </div>

                <!-- Status Card -->
                <div id="status-card" class="bg-gray-900/60 p-6 rounded-xl border border-gray-700 flex items-center transition-colors duration-300 border-gray-700">
                    <div id="status-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mr-4 bg-gray-600">
                        <!-- SVG Icon will be injected here -->
                    </div>
                    <div>
                        <h3 id="status-text" class="text-xl font-semibold text-white">Idle</h3>
                        <p id="status-description" class="text-gray-400">Waiting for optimal price.</p>
                    </div>
                </div>
            </div>
        </main>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element References ---
            const chartContainer = document.getElementById('chart-container');
            const marketPriceEl = document.getElementById('market-price');
            const batteryLevelEl = document.getElementById('battery-level');
            const batteryPercentageEl = document.getElementById('battery-percentage');
            const statusTextEl = document.getElementById('status-text');
            const statusDescriptionEl = document.getElementById('status-description');
            const statusCardEl = document.getElementById('status-card');
            const statusIconContainerEl = document.getElementById('status-icon-container');
            const simulationTimeEl = document.getElementById('simulation-time');

            // --- Simulation Configuration ---
            const prices = [15, 12, 10, 8, 7, 9, 14, 20, 25, 30, 28, 22, 18, 16, 19, 24, 35, 45, 42, 38, 30, 22, 18, 16];
            const chargeThreshold = 12; // Price below which we charge
            const dischargeThreshold = 30; // Price above which we discharge
            const chargeRate = 10; // % per hour
            const dischargeRate = 15; // % per hour
            const maxPrice = Math.max(...prices);
            
            let batteryLevel = 50; // Initial battery level
            let currentHour = 0;
            let simulationInterval = null;
            let isRunning = false;

            // --- SVG Icons ---
            const icons = {
                charging: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3,2.05c-0.39-0.39-1.02-0.39-1.41,0L3.05,8.89c-0.39,0.39-0.39,1.02,0,1.41l6.84,6.84c0.39,0.39,1.02,0.39,1.41,0l6.84-6.84c0.39-0.39,0.39,1.02,0-1.41L11.3,2.05z M10,14.59V5.41l4.59,4.59L10,14.59z" clip-rule="evenodd" /></svg>`,
                discharging: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293,7.293a1,1,0,0,1,1.414,0L10,10.586l3.293-3.293a1,1,0,1,1,1.414,1.414l-4,4a1,1,0,0,1-1.414,0l-4-4a1,1,0,0,1,0-1.414z" clip-rule="evenodd" /></svg>`,
                idle: `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10,18a8,8,0,1,0,0-16,8,8,0,0,0,0,16zM9,9H5v2h4v4h2v-4h4V9h-4V5H9v4z" clip-rule="evenodd" /></svg>`
            };
            
            // --- Functions ---

            /**
             * Generates the initial bar chart visualization.
             */
            function generateChart() {
                chartContainer.innerHTML = '';
                prices.forEach((price, index) => {
                    const barHeight = (price / maxPrice) * 100;
                    const bar = document.createElement('div');
                    bar.style.height = `${barHeight}%`;
                    bar.classList.add('w-full', 'bg-gray-700', 'rounded-t-md', 'transition-all', 'duration-300');
                    bar.dataset.hour = index;
                    chartContainer.appendChild(bar);
                });
            }

            /**
             * Updates the UI elements based on the current simulation state.
             */
            function updateUI() {
                // Update time and price display
                const timeString = `${String(currentHour).padStart(2, '0')}:00`;
                simulationTimeEl.textContent = `Time: ${timeString}`;
                marketPriceEl.textContent = prices[currentHour];
                
                // Update battery visual
                batteryLevelEl.style.height = `${batteryLevel}%`;
                batteryPercentageEl.textContent = `${Math.round(batteryLevel)}%`;

                // Highlight the current bar in the chart
                document.querySelectorAll('#chart-container > div').forEach((bar, index) => {
                    bar.classList.toggle('bar-highlight', index === currentHour);
                });
            }

            /**
             * Sets the status card's appearance and text.
             * @param {string} state - The current state ('charging', 'discharging', 'idle').
             */
            function setStatus(state) {
                let text, description, icon, cardClass, iconBgClass;

                switch (state) {
                    case 'charging':
                        text = 'Charging';
                        description = 'Storing energy at low market price.';
                        icon = icons.charging;
                        cardClass = 'border-green-500/50';
                        iconBgClass = 'bg-green-500/30';
                        break;
                    case 'discharging':
                        text = 'Discharging';
                        description = 'Selling energy at high market price.';
                        icon = icons.discharging;
                        cardClass = 'border-red-500/50';
                        iconBgClass = 'bg-red-500/30';
                        break;
                    default:
                        text = 'Idle';
                        description = 'Waiting for optimal price.';
                        icon = icons.idle;
                        cardClass = 'border-gray-700';
                        iconBgClass = 'bg-gray-600';
                        break;
                }
                
                statusTextEl.textContent = text;
                statusDescriptionEl.textContent = description;
                statusIconContainerEl.innerHTML = icon;
                
                // Update card border
                statusCardEl.className = statusCardEl.className.replace(/border-(green|red|gray)-[0-9]{2,3}(\/[0-9]+)?/g, '');
                statusCardEl.classList.add(cardClass);
                
                // Update icon background
                statusIconContainerEl.className = statusIconContainerEl.className.replace(/bg-(green|red|gray)-[0-9]{2,3}(\/[0-9]+)?/g, '');
                statusIconContainerEl.classList.add(iconBgClass);
            }

            /**
             * The main simulation step logic.
             */
            function simulationStep() {
                // When a 24-hour cycle is complete, restart the simulation
                if (currentHour >= prices.length) {
                    restartCycle();
                    return;
                }

                const currentPrice = prices[currentHour];
                const currentBar = chartContainer.children[currentHour];
                
                // Reset bar color
                currentBar.classList.remove('bg-green-500', 'bg-red-500');
                currentBar.classList.add('bg-gray-700');

                // --- Logic for charging/discharging ---
                // Priority 1: If it's late and battery is low, charge to prepare for next day.
                if (currentHour >= 22 && batteryLevel < 10) {
                    batteryLevel = Math.min(100, batteryLevel + chargeRate);
                    setStatus('charging');
                    currentBar.classList.remove('bg-gray-700');
                    currentBar.classList.add('bg-green-500');
                }
                // Priority 2: Standard charging on low prices
                else if (currentPrice <= chargeThreshold && batteryLevel < 100) {
                    batteryLevel = Math.min(100, batteryLevel + chargeRate);
                    setStatus('charging');
                    currentBar.classList.remove('bg-gray-700');
                    currentBar.classList.add('bg-green-500');
                } 
                // Priority 3: Standard discharging on high prices
                else if (currentPrice >= dischargeThreshold && batteryLevel > 0) {
                    batteryLevel = Math.max(0, batteryLevel - dischargeRate);
                    setStatus('discharging');
                    currentBar.classList.remove('bg-gray-700');
                    currentBar.classList.add('bg-red-500');
                } 
                // Default: Idle
                else {
                    setStatus('idle');
                }

                updateUI();

                // Advance to the next hour
                currentHour++;
            }

            /**
             * Starts the simulation loop.
             */
            function startSimulation() {
                if (isRunning) return;
                isRunning = true;
                
                // Perform the first step immediately
                simulationStep(); 
                
                // Then set the interval for subsequent steps
                simulationInterval = setInterval(simulationStep, 1000);
            }

            /**
             * Resets the simulation to its initial state and restarts it.
             */
            function restartCycle() {
                clearInterval(simulationInterval);
                simulationInterval = null;
                isRunning = false;
                
                currentHour = 0;
                batteryLevel = 50;
                
                generateChart(); // Redraws chart to clear colors
                
                // Automatically restart the simulation for a continuous loop
                startSimulation();
            }

            // --- Initial Setup ---
            // Set up the initial state and start the simulation on page load
            generateChart();
            updateUI();
            setStatus('idle');
            startSimulation();
        });
    </script>
</body>
</html>
